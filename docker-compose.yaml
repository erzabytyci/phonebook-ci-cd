services:
  app:
    image: erzabytyci/phonebook-frontend
    ports:
      - "5001:5001"
    container_name: phonebook-frontend

  watchtower:
    image: nickfedor/watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: watchtower